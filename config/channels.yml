    language: ar
    max_chars: 4096
    add_hashtags: 4
    add_emoji: true
    include_source_link: true
    include_signature: false
    max_posts_per_run: 3
    with_image: true
    breaking_boost: false
    review_required: false
    flash_eligible: false
    flash_priority: 5
    credentials:
      bot_token: TELEGRAM_BOT_TOKEN
      chat_id: TELEGRAM_ANIME_CHAT_ID
    # 🖋 بصمة الملكية — توقيع نصّي + علامة مائية على الصورة + علامة خفيّة
    branding:
      handle: ""   # ← @اسم_قناتك (أو من البوت: زر «🖋 البصمة»)
      title: "قناة الأنمي"
