# =============================================================================
#  AutoNews Agent — القنوات والتوجيه
#
#  لكل قناة:
#   platform      : telegram | facebook | x | console
#   sources       : ["*"] لكل المصادر، أو قائمة معرّفات من settings.yml
#   tags          : وسوم مطلوبة (فراغ = بلا شرط)
#   keywords      : كلمات مفتاحية مطلوبة في العنوان/الملخص (فراغ = بلا شرط)
#   style         : وصف الأسلوب الذي يُمرَّر للنموذج
#   max_chars     : حدّ المنصّة
#   credentials   : ربط بين اسم الحقل ومتغيّر البيئة (لا تكتب السرّ هنا!)
#   max_posts_per_run : سقف النشر لهذه القناة في التشغيل الواحد
#   with_image        : إرفاق صورة الخبر (og:image) إن وُجدت
#   review_required   : إرسال مسوّدة للموافقة قبل النشر (يتطلّب review.enabled)
#   breaking_boost    : السماح للأخبار العاجلة بتجاوز السقف
#   threads           : تقسيم الخبر الطويل إلى سلسلة (X)
#   flash_eligible    : مؤهّلة للنشر الفوري في المسار السريع (true/false)
#   style_b           : أسلوب بديل لاختبار A/B (يُستخدم بالتناوب مع style)
#   branding          : 🖋 بصمة الملكية — توقيع نصّي + علامة مائية على الصورة
#                       + علامة خفيّة (صفرية العرض) تنتقل مع النسخ واللصق.
#                       handle:@اسم_قناتك · stamp_on_image:true · hidden_mark:true
# =============================================================================

channels:
  # ---------------------------------------------------------------- تيليجرام
  - id: tg_main
    name: "القناة الرئيسية — أخبار عاجلة"
    platform: telegram
    enabled: true
    sources: ["*"]
    # 🚫 فصل القطاعات: الأنمي له قناته المتخصّصة — لا يُكرَّر هنا.
    #    احذف السطر التالي إن أردت أن تستقبل الرئيسية كل شيء.
    exclude_tags: ["أنمي"]
    style: >
      أسلوب وكالة أنباء سريعة: جملة افتتاحية قوية، لغة فصحى موجزة،
      تركيز على ما حدث ومتى وأين، بلا مبالغات. مناسب للقراءة على الهاتف.
    language: ar
    max_chars: 4096
    add_hashtags: 4
    add_emoji: true
    include_source_link: true
    include_signature: true
    signature: "📡 تابعونا للحظة بلحظة"
    max_posts_per_run: 4
    with_image: true
    breaking_boost: true
    review_required: false
    flash_eligible: true      # ← القناة الرئيسية تنشر العاجل فوراً
    flash_priority: 10
    credentials:
      bot_token: TELEGRAM_BOT_TOKEN      # من @BotFather
      chat_id: TELEGRAM_CHAT_ID          # مثل: @my_channel أو -1001234567890
    # 🖋 بصمة الملكية — توقيع نصّي + علامة مائية على الصورة + علامة خفيّة
    branding:
      handle: ""                 # ← @اسم_قناتك (أو من البوت: زر «🖋 البصمة»)
      title: "القناة الرئيسية"
      footer: "📡 @{handle}"
      stamp_on_image: true
      position: bottom-right
      hidden_mark: true
    extra:
      disable_web_page_preview: false
      # parse_mode: HTML                # فعّله فقط إن أردت وسوم HTML

