# =============================================================================
#  AutoNews Agent — الإعدادات العامة
#  المتغيّرات السرّية (المفاتيح/التوكنات) لا تُكتب هنا — تُوضع في .env أو GitHub Secrets
# =============================================================================

run:
  timezone_offset: 3          # بغداد (UTC+3) — للعرض فقط
  log_level: INFO
  max_items_per_run: 12       # أقصى عدد مقالات تُعالَج في التشغيل الواحد (يوفّر الحصة)
  max_per_source: 5           # أقصى مقالات من كل مصدر
  max_age_hours: 48           # تجاهل الأخبار الأقدم من كذا ساعة (0 = بلا حد)
  min_title_chars: 18         # تجاهل العناوين القصيرة/غير الصالحة
  dedup_similarity: 0.80      # حدّ التشابه داخل التشغيل الواحد (Jaccard)
  cross_run_dedup: true       # منع تكرار نفس الخبر عبر التشغيلات (مصادر متعدّدة)
  cross_run_lookback: 150     # عدد العناوين المنشورة سابقاً التي نقارن معها
  cross_run_similarity: 0.62  # حدّ اعتبار الخبر مكرّراً تاريخياً (أقل = أكثر صرامة)
  # ملاحظة: أثناء الأعياد/العطل/المواسم تُفتح نافذة تساهل تلقائياً
  # (تحديد «تحديث مشروع» بدل «تكرار») — انظر config/occasions.yml
  retry_failed_after_runs: 3  # إعادة محاولة الأخبار الفاشلة بعد كذا تشغيل
  request_timeout: 30         # مهلة طلبات RSS/المنصّات (ثانية)
  state_file: state/state.json
  state_commit: true          # حفظ الحالة داخل المستودع (غيّره لـ false إن أردت Artifacts فقط)
  user_agent: "AutoNewsAgent/1.0 (+https://github.com/your-user/autonews-agent)"

ai:
  provider: gemini
  # قائمة النماذج بالترتيب — أول نموذج يعمل يُستخدم، والباقي خطة بديلة.
  # يمكن تجاوزها من متغيّر البيئة GEMINI_MODELS=fake-a,fake-b,c
  models:
    - gemini-3.8-flash
    - gemini-3.6-flash
    - gemini-3.5-flash-lite
  temperature: 0.75
  max_output_tokens: 2048
  request_timeout: 90         # مهلة طلب Gemini (ثانية)
  max_retries_per_pair: 1     # إعادة محاولة للزوج نفسه عند الخطأ المؤقّت
  cooldown_quota_seconds: 900 # تجميد الزوج 15 دقيقة بعد انتهاء الحصة (429)
  cooldown_error_seconds: 60  # تجميد الزوج دقيقة بعد خطأ مؤقّت
  max_items_per_run: 12
  token_budget_per_run: 250000  # ميزانية توكنات لكل تشغيل (0 = بلا حد). يوقف التشغيل بلطف ويُكمل الباقي لاحقاً


# -----------------------------------------------------------------------------
#  التنبيهات — أقوى حماية تشغيلية: تعرف فوراً إن صمت البوت أو نفدت المفاتيح
#  (تستخدم TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID كافتراضي، أو ALERT_* المخصّصة)
# -----------------------------------------------------------------------------
alerts:
  enabled: true
  on_zero_runs: 2        # نبّه إذا مرّ تشغيلان متتاليان بلا أي نشر
  on_errors: true        # نبّه عند فشل تشغيل أو استنفاد كل مفاتيح Gemini
  daily_summary: true    # ملخّص يومي (يُرسل في تشغيل منتصف النهار)

# -----------------------------------------------------------------------------
#  🎛 لوحة التحكّم — المراجعة الذكية والمواعيد (تُدار أيضاً من البوت بأزرار)
#  review_mode:
#    smart  ⭐ لا تُراجع إلّا ما يشكّ فيه النظام (درجة منخفضة/صياغة احتياطية/
#              كلمات حسّاسة/بلا رابط). الأخبار العاجلة لا تنتظر أبداً.
#    always     كل منشور يحتاج موافقتك
#    never      نشر مباشر بلا أسئلة (لا يُنصح به قبل استقرار الجودة)
# -----------------------------------------------------------------------------
control:
  enabled: true
  review_mode: smart
  min_score: 0.85            # تحته → يُعرض للموافقة
  quiet_hours_start: -1      # -1 = معطّل · مثل 23 = ابدأ الهدوء 23:00
  quiet_hours_end: -1        # مثل 6 = انتهِ 06:00 (يُؤجَّل لا يُلغى)
  breaking_bypass_quiet: true  # 🔴 العاجل يتجاوز الهدوء دائماً (السرعة شرط)
  min_gap_minutes: 0         # فاصل أدنى بين منشورين في القناة نفسها
  max_per_hour: 0            # سقف منشورات/ساعة لكل قناة (0 = بلا حد)
  queue_max_hours: 48        # حذف ما تجمّد في الطابور
  notify_approvals: true     # إرسال ما يحتاج موافقة إلى حسابك

# -----------------------------------------------------------------------------
#  بوّابة الجودة — تمنع نشر المحتوى المشكوك فيه
# -----------------------------------------------------------------------------
quality:
  require_numbers_match: true   # ⭐ رفض أي رقم في المنشور غير موجود في الخبر الأصلي
  min_body_chars: 90            # رفض المنشورات القصيرة جداً
  max_title_chars: 160
  block_sensitive: false        # true = استبعاد الأخبار الحسّاسة تلقائياً
  max_hashtags: 6

# -----------------------------------------------------------------------------
#  صور الأخبار — سحب og:image من صفحة المصدر ورفعها مع المنشور
# -----------------------------------------------------------------------------
images:
  enabled: true
  timeout: 12
  max_bytes: 5000000
  generate_caption: true

# -----------------------------------------------------------------------------
#  المراجعة البشرية الاختيارية (مسوّدة + زرّي ✅/❌ في تيليجرام)
#  فعّلها من هنا أو بـ REQUIRE_REVIEW=true، أو لقناة واحدة عبر review_required
# -----------------------------------------------------------------------------
review:
  enabled: false
  timeout_hours: 6        # مسوّدة لم يُبتّ فيها تُلغى بعد كذا ساعة
  max_per_run: 5
  auto_approve_if_no_operator: false   # ⚠️ لا تفعّلها إلا إن أردت النشر رغم عدم الرد

# -----------------------------------------------------------------------------
#  الأخبار العاجلة — أولوية أعلى وتجاوز للسقوف
# -----------------------------------------------------------------------------
breaking:
  enabled: true
  keywords:
    - عاجل
    - عاجلة
    - انفجار
    - هجوم
    - قصف
    - غارة
    - اشتباكات
    - مقتل
    - وفيات
    - جرحى
    - استقالة
    - إقالة
    - اعتقال
    - انقلاب
    - حالة طوارئ
    - زلزال
    - حريق
    - انهيار
    - تعليق
    - breaking
    - explosion
    - earthquake
  bypass_caps: true
  priority: 10
  prefix: "🔴 عاجل"
  max_per_run: 2

# -----------------------------------------------------------------------------
#  طابور إعادة المحاولة — نشر ما فشل في تشغيلات سابقة بدل نسيانه
# -----------------------------------------------------------------------------
retry:
  enabled: true
  max_attempts: 3
  per_run: 3

# -----------------------------------------------------------------------------
#  📋 نمط النتائج — نشر «ما صار» لا «ما وقع»
#  outcomes_only : لا يُنشر الحدث الخام (انفجار/قصف/حادث) حتى تظهر نتائجه
#  hybrid        : النتائج دائماً + الحدث الكبير (طوارئ/حصيلة ثقيلة) إن استوجب
#  raw           : السلوك القديم (نشر كل عاجل)
# -----------------------------------------------------------------------------
outcomes:
  enabled: true
  # outcomes_only : لا يُنشر الحدث الخام أبداً (الأكثر أماناً)
  # hybrid        : النتائج دائماً + الحدث الكبير فقط (حصيلة كبيرة/طوارئ/إخلاء/نزوح)
  # raw           : السلوك القديم (كل عاجل يُنشر)
  policy: hybrid
  allow_incident_headlines: false   # true = السماح بنشر عنوان الحدث الخام
  governorate_matrix: true          # جدول: أي محافظة مشمولة وأي مستثناة
  min_outcome_chars: 40
  # ---- مميزات v6 ----
  impact_line: true                 # ١) سطر «الأثر عليك» في نهاية كل بطاقة
  followup: true                    # ٢) متابعة الحادثة المؤجّلة حتى تصدر نتيجتها (🔄 تطوّر)
  followup_min_hours: 1.0
  followup_max_items: 60
  followup_max_age_hours: 72        # بعدها تُحذف الحادثة من المتابعة
  daily_matrix: true                # ٣) منشور «خريطة المحافظات اليوم»
  daily_matrix_hour: 20             #    الساعة المحلية لإصداره (20 = 8 مساءً)
  contrast: true                    # ٨) كشف التفاوت بين المحافظات كخبر مستقل
  dual_verify: false                # ٥) true = لا نتيجة بلا مصدر رسمي أو مصدرين مستقلّين
  source_line: true                 # ٦) سطر الشفافية: المصدر + الثقة + العمر
  silent_enabled: true              # ٧) تنبيه إداري (لا نشر) لحادثة بلا نتائج
  silent_hours: 6.0

# -----------------------------------------------------------------------------
#  روابط UTM — لقياس أي منشور يجلب القارئ فعلاً
# -----------------------------------------------------------------------------
links:
  enabled: true
  source_override: ""        # اتركه فارغاً = اسم المنصّة؛ أو ضع اسم قناتك
  medium: social
  campaign_prefix: autonews
  keep_existing: true        # لا يلمس رابطاً فيه utm_source مسبقاً

# -----------------------------------------------------------------------------
#  لوحة الأداء HTML + «أفضل أسبوع»
# -----------------------------------------------------------------------------
dashboard:
  enabled: true
  output_file: logs/dashboard.html
  best_of_file: logs/best_of_week.md
  days: 7
  top_n: 10

# -----------------------------------------------------------------------------
#  🎬 القطاعات (عمود الأنمي)
#  نفس محرّك الأخبار، بمنطق نشر مختلف: الإعلان نفسه خبر (لا ننتظر «نتائج»)
# -----------------------------------------------------------------------------
verticals:
  anime:
    enabled: true
    min_score: 3.0             # رفعها = أخبار أهم فقط
    # الإعلان في الأنمي هو الخبر — لا نؤجّله بانتظار «نتائج»
    publish_policy: announcement
    keep_original_names: true  # أسماء الأعمال تبقى لاتينية (Kyoto Animation ≠ «كيوتو»)
    append_glossary: true      # سطر «الأسماء الأصلية» أسفل المنشور
    translate: true            # أخبار ANN/AnimeCorner تُعرَّب
    skip_incident_gate: true   # لا يمرّ على بوّابة «حدث خام بلا نتائج»

# -----------------------------------------------------------------------------
#  تعريب المصادر الأجنبية (BBC/Reuters/USGS/RT…)
# -----------------------------------------------------------------------------
translation:
  enabled: true
  target: ar
  langs: [en, fr, tr]        # اللغات التي نعرّبها (العربية تُترك كما هي)
  max_per_run: 5             # سقف التعريب لكل دورة (حفظاً لحصة Gemini)
  keep_original_name: true   # إبقاء الاسم الأصلي بين قوسين أول مرة
  require_numbers_match: true  # رفض أي تعريب يغيّر الأرقام

# -----------------------------------------------------------------------------
#  الأعياد والمناسبات الرسمية — تفعيل سياق اليوم + التساهل في تكرار أخبار العطل
# -----------------------------------------------------------------------------
occasions:
  enabled: true
  config_file: config/occasions.yml
  greetings: false      # true = نشر بطاقة تهنئة عند أول تشغيل في كل مناسبة
  tz_offset: 3          # مهم: «اليوم» يعني اليوم بتوقيتك لا UTC

# -----------------------------------------------------------------------------
#  التصفّح الآلي (Crawling)
# -----------------------------------------------------------------------------
crawl:
  enrich_articles: true   # زيارة صفحة الخبر واستخراج المتن عند نقص الخلاصة
  autodiscover: true      # البحث التلقائي عن خلاصة الموقع إذا تغيّر الرابط/توقّف
  max_retries: 2
  respect_robots: true
  fetch_budget_seconds: 240     # سقف زمني لمرحلة السحب (يمنع تجاوز مهلة GitHub Actions)
  max_enrich_per_source: 2      # أقصى عدد صفحات تُزار لكل مصدر لإكمال المتن الناقص

# -----------------------------------------------------------------------------
#  ⚡ المسار السريع (Fast Lane) — نشر الأخبار الضرورية في دقيقتها
#  يعمل بأمر مستقل: python -m autonews.flash_main --interval 60
#  أو عبر سير عمل GitHub كل 5 دقائق (.github/workflows/flash.yml)
# -----------------------------------------------------------------------------
flash:
  enabled: true
  max_age_minutes: 45        # 🔴 الأهم: لا نشر فوري لخبر أقدم من 45 دقيقة (يمنع «العاجل المتأخر»)
  min_score: 5               # عتبة التصنيف (كلما رفعت، قلّت الأخبار العاجلة)
  categories: [war, disaster, holiday, major, breaking]   # فئات النشر الفوري
  keywords: []               # كلمات إضافية خاصة بك (مثل: بغداد، الموصل، الرواتب)
  max_per_hour: 6            # سقف لكل قناة في الساعة (حماية من الفيضان والحصة)
  min_gap_seconds: 25        # فاصل أدنى بين خبرين على نفس القناة
  max_items_per_run: 3       # أقصى عدد أخبار فورية في الدورة الواحدة
  max_output_tokens: 700     # توكنات أقل = استجابة أسرع
  notify_telegram: true      # إشعار إداري عند كل نشر فوري
  # قناة «وكالة» خاصة: انشر فيها من جوالك فيخرج فوراً على قنواتك (Push-to-Channel)
  scoped_chat_id: ""         # أو متغيّر البيئة TELEGRAM_SCOPED_CHAT_ID

# -----------------------------------------------------------------------------
#  المصادر — أضف/احذف بحرّية. id يُستخدم للتوجيه في channels.yml
# -----------------------------------------------------------------------------
sources:

# -----------------------------------------------------------------------------
#  🇮🇶 المصادر العراقية العاجلة (تحقّق منها فعلياً — تعمل بخلاصة RSS)
#  هذه المصادر هي مصدر أخبار العطل والكوارث والقرارات الرسمية.
#  ملاحظة: مواقع حكومية (مجلس الوزراء، الدفاع، البنك المركزي) تحجب البوتات (403)
#  ولا توفر RSS — أضفها لاحقاً عبر مصدر «Google News» المستهدف أدناه.
# -----------------------------------------------------------------------------
  # وكالة الأنباء العراقية (واع) — رسمية. ملاحظة: /rss.xml الجذري متجمّد على أيار 2026،
  # أقسام /ar/<sec>/rss.xml هي الحيّة. نأخذ المحلي/السياسي/الدولي فقط (الرياضة تُغرق البث).
  - id: ina_official
    name: واع — محلي (رسمي)
    url: https://ina.iq/ar/local/rss.xml
    lang: ar
    official: true
    max_items: 8
    tags: ["محافظات"]
    trust: 1.3
    enabled: true
  - id: ina_politics
    name: واع — سياسي (رسمي)
    url: https://ina.iq/ar/political/rss.xml
    lang: ar
    official: true
    max_items: 8
    tags: ["سياسة", "رسمي"]
    trust: 1.3
    enabled: true
  - id: ina_world
    name: واع — دولي (رسمي)
    url: https://ina.iq/ar/international/rss.xml
    lang: ar
    official: true
    max_items: 6
    tags: [عراق, رسمي, دولي]
    trust: 1.2
    enabled: true
  - id: shafaq
    name: شفق نيوز
    url: https://shafaq.com/rss/ar
    lang: ar
    max_items: 8
    tags: ["سياسة", "عراق"]
    trust: 1.0
    enabled: true

  - id: baghdadtoday
    name: بغداد اليوم
    url: https://baghdadtoday.news/rss
    lang: ar
    max_items: 6
    tags: ["أمن", "عراق"]
    trust: 0.9
    enabled: true

  - id: almadapaper
    name: المدى
    url: https://almadapaper.net/rss
    lang: ar
    max_items: 5
    tags: ["ثقافة"]
    trust: 0.9
    enabled: true

  - id: ultrasawt
    name: ألترا عراق
    url: https://ultrairaq.ultrasawt.com/rss
    lang: ar
    max_items: 6
    tags: [عراق, مجتمع]
    trust: 0.85
    enabled: true

  - id: iraq_964
    name: شبكة 964 (JSON Feed)
    url: https://964media.com/feed
    type: json_feed
    lang: ar
    max_items: 6
    tags: [عراق, مجتمع]
    trust: 0.9
    enabled: false        # ⚠️ يردّ «Access denied» للبوتات — فعّله فقط إن فتحوا الوصول

  - id: gnews_iraq_urgent
    name: Google News — عاجل العراق
    # when:1d ضروري: بدونه يعيد Google أخباراً عمرها أشهر (خرّب حارس الحداثة)
    url: https://news.google.com/rss/search?q=%D8%B9%D8%A7%D8%AC%D9%84+%D8%A7%D9%84%D8%B9%D8%B1%D8%A7%D9%82+when:1d&hl=ar&gl=IQ&ceid=IQ:ar
    lang: ar
    max_items: 8
    tags: ["عاجل", "عراق"]
    trust: 0.7
    enabled: true

  - id: gnews_holiday_iq
    name: Google News — عطلة رسمية العراق
    url: https://news.google.com/rss/search?q=%D8%B9%D8%B7%D9%84%D8%A9+%D8%B1%D8%B3%D9%85%D9%8A%D8%A9+%D8%A7%D9%84%D8%B9%D8%B1%D8%A7%D9%82+when:7d&hl=ar&gl=IQ&ceid=IQ:ar
    lang: ar
    max_items: 6
    tags: [عطلة, رسمي, عراق]
    trust: 0.75
    enabled: true

  - id: gnews_transport_iq
    name: Google News — طرق ومواصلات العراق
    url: https://news.google.com/rss/search?q=%D8%B7%D8%B1%D9%82+%D8%A7%D9%84%D8%B9%D8%B1%D8%A7%D9%82+%D8%A5%D8%BA%D9%84%D8%A7%D9%82+when:2d&hl=ar&gl=IQ&ceid=IQ:ar
    lang: ar
    max_items: 5
    tags: [خدمات, عراق]
    trust: 0.7
    enabled: false        # فعّلها إن أردت متابعة الطرق يومياً

  - id: usgs_quakes
    name: USGS — زلازل قوية (عالمي)
    url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.atom
    lang: en
    max_items: 4
    tags: [كوارث, علوم]
    trust: 1.2            # مصدر علمي رسمي
    official: true
    enabled: true

  - id: gdacs_alerts
    name: GDACS — كوارث عالمية
    url: https://www.gdacs.org/xml/rss.xml
    lang: en
    max_items: 4
    tags: [كوارث]
    trust: 1.1
    enabled: false        # ضوضاء عالية للجمهور العربي — فعّلها عند الحاجة

  # ---- مؤسسي/رسمي عبر Google News (المواقع الحكومية تحجب البوتات 403) ----
  - id: gnews_security_cell
    name: خلية الإعلام الأمني (رسمي)
    # when:1d إجباري — بيان أمني رسمي بلا تاريخ حديث = لا قيمة
    url: https://news.google.com/rss/search?q=%D8%AE%D9%84%D9%8A%D8%A9+%D8%A7%D9%84%D8%A5%D8%B9%D9%84%D8%A7%D9%85+%D8%A7%D9%84%D8%A3%D9%85%D9%86%D9%8A+when:1d&hl=ar&gl=IQ&ceid=IQ:ar
    lang: ar
    official: true
    max_items: 6
    tags: ["أمن", "عراق"]
    trust: 1.25
    enabled: true
  - id: gnews_gov_decisions
    name: قرارات حكومية (رسمي)
    url: https://news.google.com/rss/search?q=%D9%85%D8%AC%D9%84%D8%B3+%D8%A7%D9%84%D9%88%D8%B2%D8%B1%D8%A7%D8%A1+%D8%A7%D9%84%D8%B9%D8%B1%D8%A7%D9%82+%D9%82%D8%B1%D8%A7%D8%B1%D8%A7%D8%AA+when:1d&hl=ar&gl=IQ&ceid=IQ:ar
    lang: ar
    official: true
    max_items: 6
    tags: ["سياسة", "قرارات"]
    trust: 1.2
    enabled: true
  # ==========================================================================
  #  🎬 عمود الأنمي — مصادر مختبرة فعلياً (2026-11)
  #  كلها تُعرَّب تلقائياً، وأسماء الأعمال تبقى لاتينية.
