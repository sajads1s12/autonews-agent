# =============================================================================
#  الأعياد والمناسبات الرسمية — تجعل النظام «يفهم» سياق اليوم
#
#  لماذا؟ لأن الأخبار المتكررة عن العطلة/المناسبة **مشروعة**:
#  يُعلنون عطلة اليوم، ثم غداً «تمديد العطلة» — وهذا خبر جديد لا تكرار.
#
#  كيف يعمل؟
#   relax_dedup: true   ⇒ يُسمح بنشر «تحديث» على نفس الموضوع بدل حجبه
#   update_window_hours ⇒ أقصى مدة يُعتبر الخبر بعدها «تحديثاً» لنفس الموضوع
#   max_updates         ⇒ أقصى عدد تحديثات لنفس الموضوع خلال المناسبة
#   tone/style_hint     ⇒ يُمرَّر للنموذج: نبرة المناسبة (احتفالية/رسمية/حذرة)
#   greeting            ⇒ نص تهنئة يُنشر مرّة واحدة (اختياري) للقنوات المفعّلة
#
#  طرق تحديد التواريخ الثلاث (استخدم أيّاً منها):
#   annual:  ["03-21"]                       تاريخ ثابت كل سنة (MM-DD)
#   ranges:  ["2026-03-20..2026-03-22"]      نطاق محدد بالسنة
#   season:  {from: "06-01", to: "08-31"}    موسم متكرر (موجات حر/أمطار)
#
#  ⚠️ التواريخ الهجرية تقديرية (تتغيّر ±يوم حسب الرؤية). صحّحها سنوياً.
# =============================================================================

greetings:
  enabled: false        # true = نشر بطاقة تهنئة مرّة واحدة في أول تشغيل بكل مناسبة

# إشارات «هذا الخبر تحديث لخبر سابق» — تُستخدم لكشف التحديثات خارج المناسبات أيضاً
update_keywords:
  - تمديد
  - يُمدد
  - مددت
  - استمرار
  - تفاصيل
  - تحديث
  - ملحق
  - إضافة
  - تعديل
  - قرار جديد
  - إعلان ثانٍ
  - بيان
  - حصيلة
  - ارتفاع الحصيلة
  - تعليق
  - استئناف
  - رفع
  - خفض
  - إلغاء
  - تأجيل
  - متابعة
  - عاجل الآن
  - توضيح

