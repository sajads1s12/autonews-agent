# =============================================================================
#  🎛 لوحة التحكّم والبوت — كل ٥ دقائق
#
#  كان لدينا ملفّان (setup.yml + control.yml) يفعلان الشيء نفسه تقريباً:
#  كلاهما يستدعي نفس البوت (setup_main --poll). دمجهما:
#    • يمنع تعارضاً حقيقياً: تشغيلان يقرآن getUpdates فيسرق أحدهما تحديثات الآخر
#    • يوفّر ~٣٠٠ دقيقة شهرياً
#    • يجعل «أين أضغط؟» سؤالاً واحداً لا اثنين
#
#  هذا الملف يشمل: لوحة القنوات · ربط القنوات · الموافقات · التحكّم ·
#  البصمة · الإحصاءات · صفحة فيسبوك · الرسائل النصّية للبوت.
# =============================================================================
name: 🎛 لوحة التحكّم والبوت

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      send_panel:
        description: "أرسل لوحة التحكّم الآن"
        type: boolean
        default: true
      rounds:
        description: "عدد دورات الاستماع (1–5)"
        type: string
        default: "3"

concurrency:
  group: autonews-bot            # 🚫 بوت واحد فقط — وإلا تسرق التشغيلات تحديثات بعضها
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  control:
    name: معالجة الأزرار والموافقات
    runs-on: ubuntu-latest
    timeout-minutes: 6

    env:
      PYTHONPATH: src
      TZ_OFFSET: "3"
      STATE_REPO: ${{ secrets.STATE_REPO }}
      STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}

    steps:
      - name: ⬇️ جلب الكود
        uses: actions/checkout@v4

      - name: 🧰 تجهيز البيئة
        uses: ./.github/actions/setup

      - name: 🔗 استعادة الحالة (المعرّفات + الطابور + البصمات)
        uses: ./.github/actions/state
        with:
          action: restore

      - name: 📤 إرسال اللوحة (عند الطلب)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.send_panel == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python -m autonews.setup_main --panel

      - name: 🎛 معالجة الضغطات والرسائل
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SETUP_ALLOWED_USERS: ${{ secrets.SETUP_ALLOWED_USERS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ANIME_CHAT_ID: ${{ secrets.TELEGRAM_ANIME_CHAT_ID }}
          TELEGRAM_SPORTS_CHAT_ID: ${{ secrets.TELEGRAM_SPORTS_CHAT_ID }}
          TELEGRAM_TECH_CHAT_ID: ${{ secrets.TELEGRAM_TECH_CHAT_ID }}
          TELEGRAM_ECON_CHAT_ID: ${{ secrets.TELEGRAM_ECON_CHAT_ID }}
          TELEGRAM_GAMES_CHAT_ID: ${{ secrets.TELEGRAM_GAMES_CHAT_ID }}
          TELEGRAM_LOCAL_CHAT_ID: ${{ secrets.TELEGRAM_LOCAL_CHAT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: |
          set -o pipefail
          ROUNDS="${{ github.event.inputs.rounds || '3' }}"
          python -m autonews.setup_main --poll --rounds "$ROUNDS" --wait 2

      - name: 💾 حفظ الحالة
        if: always()
        uses: ./.github/actions/state
        with:
          action: save
          message: "[state] 🎛 تحكّم وموافقات"
