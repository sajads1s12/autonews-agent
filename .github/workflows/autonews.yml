# =============================================================================
#  🤖 الدورة الأساسية — كل ساعتين
#
#  الجدولة بتوقيت UTC:  "0 */2 * * *" = 00, 02, 04 … UTC
#                                       = 03, 05, 07 … بغداد (UTC+3)
#
#  ⚠️ صراحة: Cron في GitHub Actions **ليس دقيقاً**. قد يتأخّر ٥–٣٠ دقيقة عند
#  الازدحام، وقد يُلغى نادراً. الأخبار العاجلة تعتمد على flash.yml وليس هنا.
#  GitHub Actions ليس سيرفراً دائماً متّصلاً — كل تشغيل بيئة جديدة تُدمَّر بعده.
# =============================================================================
name: 🤖 الدورة الأساسية — نشر دوري

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تشغيل تجريبي بلا نشر فعلي"
        type: boolean
        default: false
      limit:
        description: "أقصى عدد مقالات (0 = الافتراضي)"
        type: string
        default: "0"
      channels:
        description: "قنوات محدّدة مفصولة بفاصلة (فراغ = الكل)"
        type: string
        default: ""
      require_review:
        description: "إرسال المنشورات كمسوّدات للموافقة"
        type: boolean
        default: false

concurrency:
  group: autonews-main            # 🚫 لا تشغيلين متزامنين (يمنع النشر المزدوج)
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cycle:
    name: دورة النشر
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PYTHONPATH: src
      TZ_OFFSET: "3"
      STATE_REPO: ${{ secrets.STATE_REPO }}
      STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}

    steps:
      - name: ⬇️ جلب الكود
        uses: actions/checkout@v4

      - name: 🧰 تجهيز البيئة
        uses: ./.github/actions/setup

      - name: 🔗 استعادة الحالة (منع التكرار يعتمد عليها)
        uses: ./.github/actions/state
        with:
          action: restore

      - name: 🩺 فحص الصحة والإعدادات
        continue-on-error: true
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: python -m autonews.main --check

      - name: 🚀 تشغيل دورة النشر
        id: run
        env:
          # ---- مفاتيح Gemini (٥: مجتمعة أو منفردة) ----
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_MODELS: ${{ secrets.GEMINI_MODELS }}
          # ---- تيليجرام ----
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TECH_CHAT_ID: ${{ secrets.TELEGRAM_TECH_CHAT_ID }}
          # ---- فيسبوك ----
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          # ---- X (اختياري) ----
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # ---- التنبيهات ----
          ALERT_BOT_TOKEN: ${{ secrets.ALERT_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          # ---- تحكّم التشغيل (يدوي فقط) ----
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || '' }}
          MAX_ITEMS_PER_RUN: ${{ github.event.inputs.limit != '0' && github.event.inputs.limit || '' }}
          ENABLED_CHANNELS: ${{ github.event.inputs.channels }}
          REQUIRE_REVIEW: ${{ github.event.inputs.require_review == 'true' && 'true' || '' }}
        run: python -m autonews.main --once

      - name: 📊 بناء اللوحة والتقارير
        if: always()
        continue-on-error: true
        run: python -m autonews.dashboard_main

      - name: 💾 حفظ الحالة
        if: always()
        uses: ./.github/actions/state
        with:
          action: save
          message: "[state] 🤖 الدورة الأساسية"

      - name: 📤 أرشفة التقرير (تشخيص بلا أسرار)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: logs/report.md
          retention-days: 7
          if-no-files-found: ignore
