# =============================================================================
#  ⚡ المسار السريع — فحص الأخبار العاجلة كل ٥ دقائق
#
#  لماذا ٥ دقائق؟ GitHub يرفض جدولة أقلّ من ذلك. التأخير الواقعي ٥–٢٠ دقيقة
#  بحسب ازدحام GitHub. لمن يريد ثوانٍ: مشغّل مستمر (VPS/Docker) بنفس الأمر.
#
#  ملاحظة صريحة: **Cron في GitHub ليس دقيقاً** — قد يتأخّر أو يُلغى عند
#  الحمل العالي. لا نبني عليه وعداً بتوقيت الثانية.
#
#  التكلفة: المستودع العام = دقائق مجانية بلا حدّ. الخاص = ~٥٠٠ دقيقة/شهر.
# =============================================================================
name: ⚡ المسار السريع — أخبار عاجلة

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تجريبي بلا نشر"
        type: boolean
        default: false

# 🔒 منع تشغيل نسختين متعارضتين من المهمة نفسها
concurrency:
  group: autonews-flash
  cancel-in-progress: false        # لا نُلغي تشغيلاً جارياً (قد يكون في منتصف النشر)

permissions:
  contents: read                   # الحالة في المستودع الخاص — لا حاجة للكتابة هنا

jobs:
  flash:
    name: فحص عاجل
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      PYTHONPATH: src
      TZ_OFFSET: "3"
      # ---- مزامنة الحالة (اختيارية — النظام يعمل بلاها) ----
      STATE_REPO: ${{ secrets.STATE_REPO }}
      STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}

    steps:
      - name: ⬇️ جلب الكود
        uses: actions/checkout@v4

      - name: 🧰 تجهيز البيئة
        uses: ./.github/actions/setup

      - name: 🔗 استعادة الحالة
        uses: ./.github/actions/state
        with:
          action: restore

      - name: ⚡ فحص عاجل ونشر
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_MODELS: ${{ secrets.GEMINI_MODELS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TECH_CHAT_ID: ${{ secrets.TELEGRAM_TECH_CHAT_ID }}
          TELEGRAM_SCOPED_CHAT_ID: ${{ secrets.TELEGRAM_SCOPED_CHAT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          ALERT_BOT_TOKEN: ${{ secrets.ALERT_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || '' }}
        # لا نُفشل التشغيل عند فشل الشبكة: البوت يتعامل مع الفشل داخلياً
        continue-on-error: true
        run: python -m autonews.flash_main

      - name: 💾 حفظ الحالة
        if: always()
        uses: ./.github/actions/state
        with:
          action: save
          message: "[state] ⚡ المسار السريع"
